name: Unpack site

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded site ZIP
        run: |
          rm -rf .tmp-site
          mkdir .tmp-site
          unzip -o bungee-volkan-logo-v2.zip -d .tmp-site
          cp .tmp-site/bungee-homepage/index.html ./index.html
          rm -rf ./assets
          cp -R .tmp-site/bungee-homepage/assets ./assets
          cp .tmp-site/bungee-homepage/routes.txt ./routes.txt
          rm -rf .tmp-site
      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets routes.txt
          git diff --cached --quiet || git commit -m "Extract site files for live editing"
          git push
