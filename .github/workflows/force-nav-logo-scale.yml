name: Force nav logo scale

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/force-nav-logo-scale.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge only the top-left navigation logo by 30 percent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="assets/volkan-alagoz-logo-kucuk.png" alt="Volkan Alagöz Logo" class="nav-logo"'
          new = 'src="assets/volkan-alagoz-logo-kucuk.png" alt="Volkan Alagöz Logo" style="transform:scale(1.3) !important;transform-origin:left center !important;max-width:none !important;" class="nav-logo"'
          if old in s:
              s = s.replace(old, new, 1)
          else:
              import re
              s, n = re.subn(r'(src="assets/volkan-alagoz-logo-kucuk\.png"[^>]*?)\sclass="nav-logo"', r'\1 style="transform:scale(1.3) !important;transform-origin:left center !important;max-width:none !important;" class="nav-logo"', s, count=1)
              if n == 0:
                  raise SystemExit('Navigation logo tag not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit logo size change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Force top-left logo 30 percent larger"
          git push
